# Alembic, for the surface's OWN database only.
#
# Brightbean's database is never migrated from here and never will be:
# that schema belongs to Brightbean, and this application reads it over a
# connection PostgreSQL holds read-only.
#
# NO sqlalchemy.url HERE, DELIBERATELY. The URL carries a password, and
# this file is committed. migrations/env.py reads it from the environment
# instead, so a credential cannot arrive in the repository by somebody
# filling in the obvious blank.

[alembic]
script_location = migrations
prepend_sys_path = .

# Migration files sort by name in every listing there is, so the name
# starts with the moment it was generated. `0001_`-style counters
# collide the first time two people generate on the same afternoon.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
