<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- lang is set again at runtime from the site configuration, so a
         second deployment in another language announces itself
         correctly. This is the value before the first fetch returns. -->
    <title>Verein für Modellflug Stutensee</title>
    <meta
      name="description"
      content="Der Verein für Modellflug Stutensee — RC-Modellflug am Flugplatz nördlich von Stutensee. Lehrer-Schüler-Training, Flugtage und Schnupperfliegen."
    />
    <meta name="theme-color" content="#0d1b2a" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />

    <!-- THE THEME IS DECIDED BEFORE ANYTHING IS PAINTED, and that is why
         this is an inline script in the head rather than something React
         does on mount.

         React runs after the document has already been painted once. A
         member who has chosen the dark design would get a full white
         flash of the page — header, cards and all — and then have it go
         dark under them, on every single navigation. That flash is the
         entire reason theme switches are done this way.

         BRIGHT IS THE DEFAULT, FULL STOP. It deliberately does NOT ask
         prefers-color-scheme: a first-time visitor gets the club's site
         as the club designed it, and dark is something a person chooses
         here rather than something their laptop chooses for them. The
         system query is gone rather than merely overridden — a fallback
         nobody wants is a second behaviour to keep working.

         IT WRITES AN EXPLICIT data-theme either way, so the stylesheet
         needs one dark block keyed on that attribute rather than the
         same values written twice.

         WRAPPED, because reading document.cookie can throw in a browser
         with site data switched off, and an exception here would stop
         the page loading at all. That visitor gets the bright site,
         which is the default anyway. -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = /(?:^|;\s*)vfm-theme=dark(?:\s*;|\s*$)/.test(document.cookie);
        } catch (e) {
          dark = false;
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
